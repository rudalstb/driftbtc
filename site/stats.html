<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>화면 이용 집계 · BTC Agent</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="page.css">
</head>
<body>
<main class="page">
  <header><a class="home" href="index.html">BTC Agent</a><h1>화면 이용 집계</h1><div class="updated">어떤 영역이 얼마나 보였는지 (영역 이름과 횟수만, 개인정보 없음) · 최근 7일</div></header>
  <div id="out" class="box">불러오는 중…</div>
  <footer><a href="index.html">홈</a></footer>
</main>
<script src="config.js"></script>
<script>
(async () => {
  const out = document.getElementById("out");
  try {
    const r = await fetch(window.VISIT_URL + "?stats=1", { cache: "no-store" });
    const j = await r.json();
    if (!j.days) { out.textContent = "집계가 아직 없어요."; return; }
    const names = {
      forecast: "예측 범위", calc: "이 가격 될까", risk: "얼마나 들어갈까", futures: "선물 지표", filter: "들어가도 될까",
      "my-analysis": "내 매매 해부", "my-analysis-used": "내 매매 해부 · 파일 올림", mypos: "운영자 공개", game: "롱/숏 게임", chart: "가격 차트", accuracy: "정확도",
      "share-forecast": "공유 · 예측", "share-filter": "공유 · 신호등",
      "push-on": "🔔 푸시 켬", "push-off": "🔔 푸시 끔", "push-morning-on": "☀️ 아침 요약 켬", "push-morning-off": "☀️ 아침 요약 끔",
      "push-nudge-shown": "⚡ 급변 권유 뜸", "push-nudge-yes": "⚡ 권유 → 알림 받기", "push-nudge-no": "⚡ 권유 닫음", "push-ios-guide": "📲 아이폰 설치 방법 봄",
      "push-sent-jump": "📤 급변 푸시 보냄(건)", "push-sent-morning": "📤 아침 요약 보냄(건)", "push-sent-event": "📤 발표 알림 보냄(건)", "push-events-on": "📅 발표 알림 켬", "push-events-off": "📅 발표 알림 끔", "open-push-event": "📥 발표 알림 눌러 들어옴",
      "open-push-jump": "📥 급변 알림 눌러 들어옴", "open-push-morning": "📥 아침 요약 눌러 들어옴", "open-push-on": "📥 확인 알림 눌러 들어옴",
    };
    const secs = [...new Set(j.days.flatMap((d) => Object.keys(d.sections)))];
    const total = (s) => j.days.reduce((a, d) => a + (d.sections[s] || 0), 0);
    secs.sort((a, b) => total(b) - total(a));
    out.innerHTML = `<table><thead><tr><th>영역</th>${j.days.map((d) => `<th>${d.date.slice(5)}</th>`).join("")}<th>7일 합</th></tr></thead><tbody>` +
      secs.map((s) => `<tr><td>${names[s] || s}</td>${j.days.map((d) => `<td>${d.sections[s] || ""}</td>`).join("")}<td><b>${total(s)}</b></td></tr>`).join("") +
      `</tbody></table><p class="muted" style="font-size:13px">순 방문자 오늘 ${j.today ?? "-"} · 어제 ${j.yesterday ?? "-"}. 영역 집계는 한 브라우저 탭에서 하루 1번만 셉니다.</p>`;
    // 📈 글 페이지 (site/page.js): 많이 본 글 20개 · 들어온 경로
    const tbl = (title, keys, get, label) => {
      const sum = (k) => j.days.reduce((a, d) => a + (get(d)[k] || 0), 0);
      keys = keys.sort((a, b) => sum(b) - sum(a));
      return `<h2 style="font-size:16px;margin-top:24px">${title}</h2>` + (keys.length ? `<table><thead><tr><th></th>${j.days.map((d) => `<th>${d.date.slice(5)}</th>`).join("")}<th>7일 합</th></tr></thead><tbody>` +
        keys.map((k) => `<tr><td>${label(k)}</td>${j.days.map((d) => `<td>${get(d)[k] || ""}</td>`).join("")}<td><b>${sum(k)}</b></td></tr>`).join("") + "</tbody></table>" : `<p class="muted">아직 기록이 없어요.</p>`);
    };
    const pg = (d) => d.pages || {}, rf = (d) => d.refs || {};
    const pkeys = [...new Set(j.days.flatMap((d) => Object.keys(pg(d))))];
    const top = pkeys.map((k) => [k, j.days.reduce((a, d) => a + (pg(d)[k] || 0), 0)]).sort((a, b) => b[1] - a[1]).slice(0, 20).map((x) => x[0]);
    const kind = { search: "🔎 검색", internal: "🔗 사이트 안 링크", direct: "⌨️ 직접·즐겨찾기·앱", other: "🌐 다른 사이트" };
    out.insertAdjacentHTML("beforeend",
      tbl("📈 많이 본 글 (7일, 상위 20)", top, pg, (k) => `<a href="${k === "index" ? "./" : k}">${k}</a>`) +
      tbl("🧭 글로 들어온 경로", [...new Set(j.days.flatMap((d) => Object.keys(rf(d))))], rf, (k) => kind[k] || k) +
      `<p class="muted" style="font-size:13px">글 페이지(일지·가이드·안내)를 열 때마다 셉니다. 메인 화면은 위 영역 표와 방문자 수에 따로 잡혀요.</p>`);
  } catch (e) {
    out.textContent = "집계를 불러오지 못했어요: " + e.message;
  }
})();
</script>
</body>
</html>
