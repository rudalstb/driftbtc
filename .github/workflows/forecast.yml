name: forecast

on:
  schedule:
    # GitHub 예약 실행은 자주 누락·지연되므로 한 시간에 4번 확인한다 (붐비는 정각 근처는 피함).
    # 새 1시간 캔들이 없으면 바로 끝나서 커밋·배포가 생기지 않는다.
    - cron: "2,17,32,47 * * * *"
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "reports/**"]
  workflow_dispatch:
    # Cloudflare Cron(worker/cron.js)이 매시간 이 방식으로 실행시킨다. 새 캔들이 없으면 바로 끝난다
    inputs:
      backtest:
        description: "백테스트도 다시 실행"
        type: boolean
        default: false
      force:
        description: "새 캔들이 없어도 예측·배포"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      # push 로 시작된 실행은 기본값이면 그 커밋을 받는데, 대기열에서 기다리는 사이 앞 실행이 site/data 를
      # 이미 올렸으면 같은 파일을 다시 만들어 rebase 충돌이 난다. 그래서 늘 main 의 최신을 받는다
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 캔들 CSV 를 실행 간에 재사용해 증분 수집만 한다
      - uses: actions/cache@v4
        with:
          path: data
          key: candles-${{ github.run_id }}
          restore-keys: candles-

      - name: 데이터 갱신
        run: python data.py

      # 새 1시간 캔들이 마감됐는지, 백테스트가 7일 이상 지났는지 확인
      - name: 갱신 필요 여부 확인
        id: check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, time, pandas as pd
          from pathlib import Path
          import data
          last = data.load("1h").index[-1] + pd.Timedelta(hours=1)
          try:
              cur = json.loads(Path("site/data/forecast.json").read_text(encoding="utf-8"))["forecasts"]["1h"]["as_of"]
          except Exception:
              cur = None
          event = os.environ["EVENT"]
          new = event == "push" or os.environ.get("FORCE") == "true" or cur is None or pd.Timestamp(cur) < last
          stamp = Path("reports/backtest_at.txt")
          due = os.environ.get("FORCE_BT") == "true" or not stamp.exists() or time.time() - float(stamp.read_text()) > 7 * 86400
          print(f"new={'true' if new or due else 'false'}")
          print(f"backtest={'true' if due else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          FORCE_BT: ${{ inputs.backtest }}
          FORCE: ${{ inputs.force }}

      - name: 백테스트 (7일마다 또는 수동)
        if: steps.check.outputs.backtest == 'true'
        run: |
          python backtest.py
          python signals.py
          date +%s > reports/backtest_at.txt

      # CPI·FOMC 일정(events.json)을 원장(event_dates.json)과 연준 공식 페이지로 갱신 — 실패해도 예측은 계속
      - name: 발표 일정 갱신
        id: s_events
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        run: python events_update.py

      - name: 예측 생성
        if: steps.check.outputs.new == 'true'
        run: python forecast.py --no-update

      # Ξ 이더리움 예측 범위 (같은 방법, 실패해도 비트코인 예측·배포는 계속)
      - name: 이더리움 예측
        id: s_eth
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        run: python eth.py

      - name: 운영자 청산 기록 보관
        if: steps.check.outputs.new == 'true'
        run: python trades.py

      - name: 운영자 입출금 기록 보관
        if: steps.check.outputs.new == 'true'
        run: python flows.py

      - name: 시장 지표 스냅샷 수집
        if: steps.check.outputs.new == 'true'
        run: python collector.py

      # 💥 OKX 비트코인 선물 강제 청산 시간별 집계 (실패해도 계속)
      - name: 강제 청산 집계
        id: s_liq
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        run: python liq.py

      - name: 과거와 비교 (닮은꼴·조건별 통계)
        if: steps.check.outputs.new == 'true'
        run: python history.py

      # 하루 한 번 시장 일지 글 (이미 있으면 목록·sitemap 만 갱신)
      - name: 시장 일지
        id: s_daily
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        run: python daily.py

      # 매달 1일: 지난달 성적표 (이미 있으면 목록·sitemap 만 갱신)
      - name: 월간 성적표
        id: s_monthly
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        run: python monthly.py

      # 매주 월요일: 지난주 주간 일지 (이미 있으면 목록·sitemap 만 갱신)
      - name: 주간 일지
        id: s_weekly
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        run: python weekly.py

      # 주 1회(백테스트 때): 지난 1년 1분봉으로 '급변 뒤 30분' 통계 (1분봉은 data/ 캐시에 쌓아 새 부분만 받음)
      - name: 급변 통계
        if: steps.check.outputs.backtest == 'true'
        continue-on-error: true
        run: python jumps_stats.py

      # 주 1회: 데이터로 쓰는 가이드(급변·발표·공포탐욕·시간대) 숫자를 새로 넣어 다시 쓴다 (+ sitemap · rss)
      - name: 가이드 숫자 갱신
        if: steps.check.outputs.backtest == 'true'
        continue-on-error: true
        run: python pages.py

      # 아침 브리핑에 오늘 시장 일지 링크를 넣으려고 일지 다음에 보낸다
      - name: 텔레그램 채널 알림
        if: steps.check.outputs.new == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 실패해도 넘어가는 단계 가운데 이번에 실패한 것 (notify.py 가 처음 실패·복구 때 한 번씩 알린다)
          STEP_FAIL: >-
            ${{ steps.s_events.outcome == 'failure' && 'events' || '' }}
            ${{ steps.s_eth.outcome == 'failure' && 'eth' || '' }}
            ${{ steps.s_liq.outcome == 'failure' && 'liq' || '' }}
            ${{ steps.s_daily.outcome == 'failure' && 'daily' || '' }}
            ${{ steps.s_monthly.outcome == 'failure' && 'monthly' || '' }}
            ${{ steps.s_weekly.outcome == 'failure' && 'weekly' || '' }}
        run: python notify.py

      - name: 신호 실험실 채점 (주 1회)
        if: steps.check.outputs.backtest == 'true'
        run: python lab.py

      - name: 방문자 수 백업
        if: steps.check.outputs.new == 'true'
        run: python visits.py

      - name: 예측 기록 커밋
        if: steps.check.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add site/data site/daily site/weekly site/monthly site/guide site/sitemap.xml site/rss.xml site/about.html site/faq.html site/privacy.html site/disclaimer.html reports/summary.json reports/signal_backtest.json reports/backtest_at.txt
          git diff --cached --quiet || git commit -m "forecast $(date -u +'%Y-%m-%d %H:%M') UTC"
          # 그 사이 다른 커밋이 올라오면 push 가 거절되므로 3번까지 다시 받아 올린다
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep $((i * 5)); done; exit 1

      # 🔔 배포 전: 지금 떠 있는 sitemap 과 비교해 새 글·바뀐 글 주소를 적어 둔다 (실패해도 배포는 계속)
      - name: 검색엔진에 알릴 주소 고르기
        id: s_indexnow
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        run: python indexnow.py plan

      # 공유 미리보기 이미지: 저장소에는 넣지 않고(용량) 배포본에만 포함
      - name: 공유 미리보기 이미지
        if: steps.check.outputs.new == 'true'
        run: python og.py

      # 배포본에서만: 스크립트 7개를 bundle.js 하나로 합치고, 캐시를 피하도록 커밋 버전을 붙인다 (저장소 파일은 그대로)
      - name: 스크립트 합치기 · 버전 표시
        if: steps.check.outputs.new == 'true'
        run: |
          python bundle.py "${GITHUB_SHA::7}"
          grep -E "style.css|bundle.js" site/index.html

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.new == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.new == 'true'
        with:
          path: site
      # 배포는 GitHub 쪽 일시 장애로 가끔 실패한다("No artifacts named github-pages", "Fetching artifact metadata failed").
      # 한 번 실패하면 1분 기다렸다가 같은 묶음으로 한 번 더 배포하고, 그것도 실패하면 그때 실행을 실패로 남긴다
      - id: deploy
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 배포 재시도 전 기다리기
        if: steps.check.outputs.new == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy_retry
        if: steps.check.outputs.new == 'true' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # 🔔 배포 뒤: 새 글·바뀐 글을 빙·네이버에 알린다 (IndexNow). 알릴 것이 없으면 아무것도 보내지 않는다
      - name: 검색엔진에 새 글 알림
        if: steps.check.outputs.new == 'true' && steps.s_indexnow.outcome == 'success' && (steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success')
        continue-on-error: true
        run: python indexnow.py send
