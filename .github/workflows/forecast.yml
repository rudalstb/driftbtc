name: forecast

on:
  schedule:
    # GitHub 예약 실행은 자주 누락·지연되므로 한 시간에 4번 확인한다 (붐비는 정각 근처는 피함).
    # 새 1시간 캔들이 없으면 바로 끝나서 커밋·배포가 생기지 않는다.
    - cron: "2,17,32,47 * * * *"
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "reports/**"]
  workflow_dispatch:
    # Cloudflare Cron(worker/cron.js)이 매시간 이 방식으로 실행시킨다. 새 캔들이 없으면 바로 끝난다
    inputs:
      backtest:
        description: "백테스트도 다시 실행"
        type: boolean
        default: false
      force:
        description: "새 캔들이 없어도 예측·배포"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 캔들 CSV 를 실행 간에 재사용해 증분 수집만 한다
      - uses: actions/cache@v4
        with:
          path: data
          key: candles-${{ github.run_id }}
          restore-keys: candles-

      - name: 데이터 갱신
        run: python data.py

      # 새 1시간 캔들이 마감됐는지, 백테스트가 7일 이상 지났는지 확인
      - name: 갱신 필요 여부 확인
        id: check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, time, pandas as pd
          from pathlib import Path
          import data
          last = data.load("1h").index[-1] + pd.Timedelta(hours=1)
          try:
              cur = json.loads(Path("site/data/forecast.json").read_text(encoding="utf-8"))["forecasts"]["1h"]["as_of"]
          except Exception:
              cur = None
          event = os.environ["EVENT"]
          new = event == "push" or os.environ.get("FORCE") == "true" or cur is None or pd.Timestamp(cur) < last
          stamp = Path("reports/backtest_at.txt")
          due = os.environ.get("FORCE_BT") == "true" or not stamp.exists() or time.time() - float(stamp.read_text()) > 7 * 86400
          print(f"new={'true' if new or due else 'false'}")
          print(f"backtest={'true' if due else 'false'}")
          PY
          cat "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          FORCE_BT: ${{ inputs.backtest }}
          FORCE: ${{ inputs.force }}

      - name: 백테스트 (7일마다 또는 수동)
        if: steps.check.outputs.backtest == 'true'
        run: |
          python backtest.py
          python signals.py
          date +%s > reports/backtest_at.txt

      - name: 예측 생성
        if: steps.check.outputs.new == 'true'
        run: python forecast.py --no-update

      - name: 텔레그램 채널 알림
        if: steps.check.outputs.new == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py

      - name: 운영자 청산 기록 보관
        if: steps.check.outputs.new == 'true'
        run: python trades.py

      - name: 방문자 수 백업
        if: steps.check.outputs.new == 'true'
        run: python visits.py

      - name: 예측 기록 커밋
        if: steps.check.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add site/data reports/summary.json reports/signal_backtest.json reports/backtest_at.txt
          git diff --cached --quiet || git commit -m "forecast $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash && git push

      # 공유 미리보기 이미지: 저장소에는 넣지 않고(용량) 배포본에만 포함
      - name: 공유 미리보기 이미지
        if: steps.check.outputs.new == 'true'
        run: python og.py

      # 브라우저가 이전 app.js/style.css 를 캐시해 두지 않도록 커밋 버전을 붙인다 (배포본에만 적용)
      - name: 정적 파일 버전 표시
        if: steps.check.outputs.new == 'true'
        run: |
          v=${GITHUB_SHA::7}
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$v\"|; s|src=\"app.js\"|src=\"app.js?v=$v\"|; s|src=\"config.js\"|src=\"config.js?v=$v\"|; s|src=\"analysis.js\"|src=\"analysis.js?v=$v\"|; s|src=\"risk.js\"|src=\"risk.js?v=$v\"|; s|src=\"filter.js\"|src=\"filter.js?v=$v\"|; s|src=\"csvtrades.js\"|src=\"csvtrades.js?v=$v\"|; s|src=\"share.js\"|src=\"share.js?v=$v\"|" site/index.html
          grep -E "style.css|app.js" site/index.html

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.new == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.new == 'true'
        with:
          path: site
      - id: deploy
        if: steps.check.outputs.new == 'true'
        uses: actions/deploy-pages@v4
