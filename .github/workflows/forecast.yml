name: forecast

on:
  schedule:
    - cron: "5 * * * *"      # 매시 5분: 예측 갱신
    - cron: "30 0 * * 1"     # 월요일 00:30 UTC: 백테스트 + btcgpt 비교도 갱신
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "reports/**"]
  workflow_dispatch:
    inputs:
      backtest:
        description: "백테스트도 다시 실행"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 캔들 CSV 를 실행 간에 재사용해 증분 수집만 한다
      - uses: actions/cache@v4
        with:
          path: data
          key: candles-${{ github.run_id }}
          restore-keys: candles-

      - name: 데이터 갱신
        run: python data.py

      - name: 백테스트 (주 1회 또는 수동)
        if: github.event.schedule == '30 0 * * 1' || inputs.backtest || hashFiles('reports/summary.json') == ''
        run: |
          python backtest.py
          python compare_btcgpt.py

      - name: 예측 생성
        run: python forecast.py --no-update

      - name: 예측 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add site/data reports/summary.json reports/btcgpt_compare.json
          git diff --cached --quiet || git commit -m "forecast $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
